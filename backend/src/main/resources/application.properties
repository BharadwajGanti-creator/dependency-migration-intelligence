spring.application.name=dmi-backend
server.port=8787

dmi.fixtures-root=${DMI_FIXTURES_ROOT:../fixtures}
dmi.cors.allowed-origins=http://localhost:4321,http://127.0.0.1:4321,http://localhost:5173,http://127.0.0.1:5173
dmi.rate-limit.requests-per-minute=60

dmi.explanation.enabled=false
dmi.explanation.provider=disabled
dmi.explanation.timeout-ms=5000
dmi.explanation.max-summary-chars=2000
dmi.explanation.max-claim-chars=800
dmi.explanation.max-claims=12

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
